<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Escolar{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS PERSONALIZADO -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('home') }}">🏫 Escola Virtual</a>
    <div>
      {% if session.get('usuario') %}
        <span class="text-white me-3">Olá, {{ session['usuario'] }}!</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Sair</a>
      {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm me-2">Login</a>
        <a href="{{ url_for('cadastro') }}" class="btn btn-outline-light btn-sm">Cadastro</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<!-- ✅ Rodapé fofo -->
<footer class="mt-5">
    <p>🌸 Feito com carinho — Sistema Escolar
