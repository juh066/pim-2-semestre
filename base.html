<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Sistema Escolar{% endblock %}</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS PERSONALIZADO -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    
    <!-- Fonte divertida -->
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #fff8e1;
            font-family: 'Comic Sans MS', 'Comic Neue', cursive;
            text-align: center;
        }

        .navbar {
            background-color: #fbc02d !important;
        }

        .navbar .navbar-brand {
            color: #f57f17 !important;
            font-weight: bold;
        }

        .navbar .btn-outline-light {
            color: #fff8e1 !important;
            border-color: #fff8e1 !important;
            font-weight: bold;
        }

        .navbar .btn-outline-light:hover {
            background-color: #f57f17 !important;
            border-color: #f57f17 !important;
        }

        .container {
            margin-top: 20px;
        }

        footer {
            margin-top: 50px;
            padding: 15px;
            background-color: #fff3e0;
            border-top: 2px solid #fbc02d;
            border-radius: 10px;
            color: #f57f17;
            font-weight: bold;
        }
    </style>
</head>

<body>

<nav class="navbar navbar-expand-lg navbar-light">
  <div class="container-fluid">
    <a class="navbar-brand" href="{{ url_for('home') }}">🏫 Escola Virtual</a>
    <div>
      {% if session.get('usuario') %}
        <span class="text-white me-3">Olá, {{ session['usuario'] }}!</span>
        <a href="{{ url_for('logout') }}" class="btn btn-outline-light btn-sm">Sair</a>
      {% else %}
        <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-sm me-2">Login</a>
        <a href="{{ url_for('cadastro') }}" class="btn btn-outline-light btn-sm">Cadastro</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container">
  {% block content %}{% endblock %}
</div>

<!-- ✅ Rodapé fofo -->
<footer>
    🌸 Feito com carinho — Sistema Escolar
</footer>

</body>
</html>
