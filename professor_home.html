{% extends "base.html" %}
{% block title %}Área do Professor{% endblock %}

{% block content %}
<style>
body { 
    background-color: #fff8e1; 
    font-family: 'Comic Sans MS'; 
    text-align: center; 
}
h2, h4 { 
    color: #f57f17; 
    margin-top: 20px; 
}
a { 
    display: inline-block; 
    text-decoration: none; 
    color: white; 
    background-color: #fbc02d; 
    padding: 8px 15px; 
    border-radius: 10px; 
    margin: 5px;
    font-weight: bold;
}
a:hover { 
    background-color: #f57f17; 
}
ul { 
    list-style-type: none; 
    padding: 0; 
    width: 60%; 
    margin: 20px auto; 
}
li { 
    padding: 8px; 
    margin-bottom: 5px; 
    border: 1px solid #fbc02d; 
    border-radius: 5px; 
    background-color: #fff3e0;
}
</style>

<h2>Bem-vindo, {{ nome }}!</h2>

<h4>Gerenciamento</h4>
<a href="{{ url_for('professor_notas') }}">Lançar Notas</a>
<a href="{{ url_for('professor_atividades') }}">Criar Atividades</a>

<h4>Alunos cadastrados:</h4>
<ul>
    {% for aluno in alunos %}
        <li>{{ aluno }}</li>
    {% endfor %}
</ul>
{% endblock %}
