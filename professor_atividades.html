{% extends "base.html" %}
{% block title %}Criar Atividades{% endblock %}

{% block content %}
<style>
body { 
    background-color: #fff8e1; 
    font-family: 'Comic Sans MS'; 
    text-align: center; 
}
h2, h3 { 
    color: #f57f17; 
    margin-top: 20px; 
}
form { 
    display: inline-block; 
    text-align: left; 
    background-color: #fff3e0;
    padding: 20px; 
    border: 2px solid #fbc02d; 
    border-radius: 10px; 
    margin-top: 20px;
}
label { 
    font-weight: bold; 
    color: #f57f17; 
}
select, input { 
    width: 100%; 
    padding: 5px; 
    margin-bottom: 10px; 
    border: 1px solid #fbc02d; 
    border-radius: 5px;
}
button { 
    background-color: #fbc02d; 
    color: white; 
    border: none; 
    padding: 8px 15px; 
    cursor: pointer; 
    font-weight: bold;
    border-radius: 10px;
}
button:hover { background-color: #f57f17; }
.alert { 
    color: #f57f17; 
    font-weight: bold; 
    margin-bottom: 10px; 
}
ul { 
    list-style-type: none; 
    padding: 0; 
    width: 60%; 
    margin: 20px auto; 
}
li { 
    padding: 8px; 
    margin-bottom: 5px; 
    border: 1px solid #fbc02d; 
    border-radius: 5px; 
    background-color: #fff3e0;
}
</style>

<h2>Criar Atividades</h2>

{% if mensagem %}
<div class="alert">{{ mensagem }}</div>
{% endif %}

<form method="POST">
    <label>Selecione o aluno:</label>
    <select name="aluno">
        {% for aluno in alunos %}
        <option value="{{ aluno }}">{{ aluno }}</option>
        {% endfor %}
    </select>

    <label>Descrição da atividade:</label>
    <input type="text" name="atividade" required>

    <button type="submit">Adicionar Atividade</button>
</form>

<h3>Atividades Atuais</h3>
<ul>
    {% for aluno, lista in atividades.items() %}
    <li>
        <strong>{{ aluno }}:</strong> {{ lista }}
    </li>
    {% endfor %}
</ul>
{% endblock %}
