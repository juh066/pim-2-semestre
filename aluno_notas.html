{% extends "base.html" %}
{% block title %}Notas do Aluno{% endblock %}

{% block content %}
<style>
table {
    margin: 20px auto;
    border-collapse: collapse;
    background-color: #fff3e0;
    border-radius: 10px;
    overflow: hidden;
}
th, td {
    padding: 10px 15px;
    border: 1px solid #fbc02d;
}
h2 {
    color: #f57f17;
    margin-top: 30px;
}
h4, h5 {
    color: #f57f17;
    margin-top: 15px;
}
span.text-primary {
    color: #f57f17 !important;
    font-weight: bold;
}
td[colspan] {
    text-align: center;
    font-style: italic;
    color: #f57f17;
}
</style>

<h2>Notas de {{ nome }}</h2>

<table>
  <thead>
    <tr>
      <th>#</th>
      <th>Nota</th>
    </tr>
  </thead>
  <tbody>
    {% for n in notas %}
      <tr>
        <td>{{ loop.index }}</td>
        <td>{{ n }}</td>
      </tr>
    {% else %}
      <tr>
        <td colspan="2">Nenhuma nota registrada.</td>
      </tr>
    {% endfor %}
  </tbody>
</table>

<h4>Média: <span class="text-primary">{{ media }}</span></h4>
<h5>Situação: <strong>{{ situacao }}</strong></h5>
{% endblock %}
