{% extends "base.html" %}
{% block title %}Cadastro{% endblock %}

{% block content %}
<style>
body { 
    background-color: #fff8e1; 
    font-family: 'Comic Sans MS'; 
    text-align: center; 
}
h2 { 
    color: #f57f17; 
    margin-top: 30px; 
}
form { 
    display: inline-block; 
    text-align: left; 
    background-color: #fff3e0;
    padding: 20px; 
    border: 2px solid #fbc02d; 
    border-radius: 10px; 
    margin-top: 20px;
}
label { 
    font-weight: bold; 
    color: #f57f17; 
}
input, select { 
    width: 100%; 
    padding: 5px; 
    margin-bottom: 10px; 
    border: 1px solid #fbc02d; 
    border-radius: 5px; 
}
button { 
    background-color: #fbc02d; 
    color: white; 
    border: none; 
    padding: 8px 15px; 
    cursor: pointer; 
    font-weight: bold;
    border-radius: 10px;
}
button:hover { 
    background-color: #f57f17; 
}
.alert { 
    color: #f57f17; 
    font-weight: bold; 
    margin-bottom: 10px; 
}
</style>

<h2>Cadastro</h2>

<form method="POST">
  <label>Usuário:</label>
  <input type="text" name="usuario" required>

  <label>Senha:</label>
  <input type="password" name="senha" required>

  <label>Tipo:</label>
  <select name="tipo" required>
    <option value="aluno">Aluno</option>
    <option value="professor">Professor</option>
  </select>

  {% if erro %}
    <div class="alert">{{ erro }}</div>
  {% endif %}

  <button type="submit">Cadastrar</button>
</form>
{% endblock %}
