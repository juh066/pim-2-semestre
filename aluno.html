<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Área do Aluno</title>
<style>
body { 
    background-color: #fff8e1; 
    font-family: 'Comic Sans MS'; 
    text-align: center; 
    margin: 0;
    padding: 0;
}
h1 { 
    color: #f57f17; 
    margin-top: 30px; 
}
h2 { 
    color: #f57f17; 
    margin-top: 20px; 
}
table { 
    margin: 20px auto; 
    border-collapse: collapse; 
    background-color: #fff3e0;
    border-radius: 10px;
    overflow: hidden;
}
td, th { 
    padding: 10px 15px; 
    border: 1px solid #fbc02d; 
}
p { 
    font-weight: bold; 
    color: #f57f17; 
    margin: 10px 0; 
}
a { 
    display: inline-block; 
    text-decoration: none; 
    color: white; 
    background-color: #fbc02d; 
    padding: 8px 20px; 
    border-radius: 10px; 
    margin-top: 15px;
    font-weight: bold;
}
a:hover { 
    background-color: #f57f17; 
}
</style>
</head>
<body>
<h1>🎀 Bem-vindo(a), {{ nome }} 🎀</h1>

<h2>Suas notas</h2>
<table>
<tr><th>Nota</th></tr>
{% for n in notas %}
<tr><td>{{ n }}</td></tr>
{% endfor %}
</table>

<p><b>Média:</b> {{ media }}</p>
<p><b>Situação:</b> {{ situacao }}</p>

<a href="{{ url_for('logout') }}">Sair</a>
</body>
</html>
